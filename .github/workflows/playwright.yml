name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        type: choice
        options:
          - regression
          - smoke
        default: regression
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Type-check tests
      run: npm run typecheck
    - name: Run selected Playwright suite
      run: |
        if [ "${{ inputs.suite }}" = "smoke" ]; then
          npm run test:smoke
        else
          npm run test:e2e
        fi
    - name: Generate Allure report
      if: always()
      run: |
        if find allure-results -maxdepth 1 -name '*-result.json' -print -quit 2>/dev/null | grep -q .; then
          npm run report:allure
        else
          echo "No Allure test results were generated."
        fi
    - name: Upload Allure report
      id: allure-report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-${{ github.run_number }}
        path: allure-report/
        if-no-files-found: warn
        retention-days: 30
    - name: Upload Playwright diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-diagnostics
        path: |
          playwright-report/
          test-results/
          allure-results/
        retention-days: 30
    - name: Add report link to workflow summary
      if: always()
      env:
        ALLURE_REPORT_URL: ${{ steps.allure-report.outputs.artifact-url }}
        TEST_JOB_STATUS: ${{ job.status }}
      run: |
        {
          echo "## Playwright test report"
          echo
          echo "**Workflow status:** ${TEST_JOB_STATUS}"
          echo
          if [ -n "${ALLURE_REPORT_URL}" ]; then
            echo "[Download the Allure HTML report](${ALLURE_REPORT_URL})"
          else
            echo "Allure report artifact was not generated."
          fi
          echo
          echo "[View all workflow artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        } >> "$GITHUB_STEP_SUMMARY"
